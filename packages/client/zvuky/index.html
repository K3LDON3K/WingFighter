<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wingfighter – zvuky</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      .zv { width: min(900px, 94vw); margin: 20px auto; display: flex; flex-direction: column; gap: 14px; }
      .zv .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
      .zv .grid button { text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; }
      .zv .grid button b { font-size: 15px; }
      .zv .grid button span { font-size: 12px; color: var(--muted); font-family: var(--txt); }
      .zv .vol { display: flex; align-items: center; gap: 10px; }
    </style>
  </head>
  <body>
    <div id="app" class="zv"></div>
    <script type="module" src="./zvuky.ts"></script>
  </body>
</html>
